<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨错误提示</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
</head>
<body>
<div class="error-container">
    <div class="error-icon">🚨</div>
    <div class="error-code">{{ error_code }}</div>
    <div class="error-title">{{ error_name }}</div>

    {% if error_id %}
    <div class="error-id-section">
        <div class="timestamp">发生时间: {{ timestamp }}</div>
        <div>错误追踪ID:</div>
        <div class="error-id" id="errorId">{{ error_id }}</div>
        <button id="error-copy-btn" class="copy-btn">📋点击复制</button>
    </div>
    {% endif %}

    <div class="error-details">
        <strong>错误详情:</strong>
        <div class="error-message">{{ error_description }}</div>
    </div>

    <div class="action-buttons">
        <a href="{{ url_for('page_index') }}" class="back-button">返回首页</a>
        <button onclick="history.back()" class="back-button">返回上页</button>
    </div>
    {% if error_id %}
    <div class="support-info">
        <strong>技术支持提醒💡</strong>
        <p>如果问题持续存在, 且没有思绪时, 可联系@FrankZhou</p>
        <p>复制并提供错误ID, 同时请描述遇到问题时的操作步骤, 这将帮助他快速定位和解决问题</p>
    </div>
    {% endif %}
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/error.js') }}"></script>
</body>
</html>
