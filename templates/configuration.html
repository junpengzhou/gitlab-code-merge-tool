<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦾基础配置</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
    <h1>🦾GitLab 配置</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form id="config-form" class="config-form" action="/configure" method="post">
        <div class="form-group">
            <label for="gitlab_url">GitLab 地址:</label>
            <input type="url"
                   id="gitlab_url"
                   name="gitlab_url"
                   value="http://git.wdcmall.com"
                   placeholder="http://git.wdcmall.com"
                   required
            />
        </div>

        <div class="form-group">
            <label for="api_token">API Token:</label>
            <input type="password"
                   id="api_token"
                   name="api_token"
                   placeholder="输入您的GitLab API Token(教程：http://files.wdcmall.com/pages/viewpage.action?pageId=75240921)"
                   required
            />
            <small>
                可以在 GitLab 的 Settings → Access Tokens 中创建（
                <a href="http://files.wdcmall.com/pages/viewpage.action?pageId=75240921" target="_blank">
                    参考教程
                </a>
                ）
            </small>
        </div>

        <button id="config-submit-btn" type="submit" class="btn-primary">下一步</button>
    </form>

    <div class="info-box">
        <h4>注意事项</h4>
        <ul class="info-box-ul">
            <li>所有配置信息仅保存在当前浏览器会话中</li>
            <li>请填写本人的 GitLab 账号信息, 请勿盗用他人账号进行提交!</li>
            <li>当 Token 过期时候, 请重新填写</li>
            <li>当 Gitlab 地址变更时候, 请重新填写</li>
        </ul>
    </div>
</div>
</body>
</html>
